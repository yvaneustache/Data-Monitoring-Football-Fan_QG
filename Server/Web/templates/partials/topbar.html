        <div class="topbar" role="banner">
            <div class="topbar-inner">
                <a class="brand" href="/">
                    <span class="brand-logo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"></polyline></svg>
                    </span>
                    <span>
                        <span class="brand-title">Monitoring</span>

                    </span>
                </a>
                <nav class="nav" aria-label="Navigation principale">
                    <a class="nav-link {{ 'active' if active == 'dashboard' }}" href="/">Dashboard</a>
                    <a class="nav-link {{ 'active' if active == 'comparison' }}" href="/comparison/StadiumBleacher/acoustic">Comparaison</a>
                    <a class="nav-link {{ 'active' if active == 'replay' }}" href="/replay">Rejeu</a>
                </nav>
                <div class="partners">
                    <img class="partner-club" src="{{ url_for('static', filename='images/logos/fc-lorient-blanc.svg') }}" alt="FC Lorient">
                    <img src="{{ url_for('static', filename='images/logos/lab-sticc-blanc.svg') }}" alt="Lab-STICC">

        <script>
            // Hauteur de la barre du haut (variable selon le retour à la ligne), pour placer les éléments fixés en dessous
            (function () {
                const topbar = document.querySelector(".topbar");
                const update = () => document.documentElement.style.setProperty("--topbar-height", topbar.offsetHeight + "px");
                new ResizeObserver(update).observe(topbar);
                update();

                // Titre fixé des pages de détail : compacté quand la page défile. Deux seuils distincts (réduction après 80 px, retour sous 8 px) :
                // la réduction raccourcit la page, un seuil unique ferait alterner les deux tailles (élément qui vibre).
                window.addEventListener("DOMContentLoaded", () => {
                    const heads = document.querySelectorAll(".sticky-head");
                    if (!heads.length)
                        return;
                    // La hauteur perdue par la réduction est compensée par une marge basse : la place occupée dans la page
                    // ne change pas, donc pas de recalage du défilement (qui ferait osciller l'élément entre ses deux tailles)
                    const updateStuck = () => {
                        for (const head of heads)
                        {
                            const stuck = window.scrollY > 80 ? true : (window.scrollY < 8 ? false : head.classList.contains("is-stuck"));
                            if (!stuck)
                            {
                                head.classList.remove("is-stuck");
                                head.style.marginBottom = "";
                                head.dataset.fullHeight = head.offsetHeight;
                                continue;
                            }
                            if (!head.classList.contains("is-stuck"))
                            {
                                const full = Number(head.dataset.fullHeight) || head.offsetHeight;
                                head.classList.add("is-stuck");
                                head.style.marginBottom = `${Math.max(0, full - head.offsetHeight)}px`;
                            }
                        }
                    };
                    window.addEventListener("scroll", updateStuck, { passive: true });
                    updateStuck();
                });
            })();
        </script>
