services:
    influxdb:
        image: influxdb:2.7
        container_name: influxdb
        ports:
            - "${INFLUXDB_PORT}:${INFLUXDB_PORT}"
        volumes:
            - influxdb-data:/var/lib/influxdb2
        environment:
            DOCKER_INFLUXDB_INIT_MODE: setup
            DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
            DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
            DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
            DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
            DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
        healthcheck:
            test: ["CMD", "curl", "-f", "${INFLUXDB_ADDRESS}/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    grafana:
        image: grafana/grafana:12.4.2
        container_name: grafana
        ports:
            - "${GRAFANA_PORT}:${GRAFANA_PORT}"
        volumes:
            - grafana-storage:/var/lib/grafana
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

    mqtt:
        image: eclipse-mosquitto
        container_name: mosquitto
        ports:
            - "${MQTT_BROKER_PORT}:${MQTT_BROKER_PORT}"

    postgresql:
        image: postgres:16
        container_name: postgresql
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRESQL_USER}
            POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
            POSTGRES_DB: ${POSTGRESQL_DATABASE}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER} -d ${POSTGRESQL_DATABASE}"]
            interval: 5s
            retries: 5
        ports:
            - "${POSTGRESQL_PORT}:${POSTGRESQL_PORT}"
        volumes:
            - pgdata:/var/lib/postgresql/data

    bridge-meshtastic-mqtt:
        build:
            context: .
            dockerfile: Server/Dockerfile
        container_name: bridge-meshtastic-mqtt
        env_file:
            - .env
        environment:
            PYTHONUNBUFFERED: 1
        depends_on:
            mqtt:
                condition: service_started
        volumes:
            - /dev:/dev
        device_cgroup_rules:
            - 'c 188:* rmw'
            - 'c 166:* rmw'
        command: python -m Server.Bridge.bridge_Meshtastic_MQTT

    bridge-meshcore-mqtt:
        build:
            context: .
            dockerfile: Server/Dockerfile
        container_name: bridge-meshcore-mqtt
        env_file:
            - .env
        environment:
            PYTHONUNBUFFERED: 1
        depends_on:
            mqtt:
                condition: service_started
        volumes:
            - /dev:/dev
        device_cgroup_rules:
            - 'c 188:* rmw'
            - 'c 166:* rmw'
        command: python -m Server.Bridge.bridge_Meshcore_MQTT

    bridge-mqtt-influxdb:
        build:
            context: .
            dockerfile: Server/Dockerfile
        container_name: bridge-mqtt-influxdb
        env_file:
            - .env
        depends_on:
            mqtt:
                condition: service_started
            influxdb:
                condition: service_healthy
        command: python -m Server.Bridge.bridge_MQTT_InfluxDB

    server:
        build:
            context: .
            dockerfile: Server/Dockerfile
        container_name: server
        depends_on:
            mqtt:
                condition: service_started
            influxdb:
                condition: service_healthy
            postgresql:
                condition: service_healthy
            bridge-mqtt-influxdb:
                condition: service_started
            bridge-meshtastic-mqtt:
                condition: service_started
        env_file:
            - .env
        command: python -m Server.Web.app
        ports:
            - "${WEB_PORT}:${WEB_PORT}"

    tracker:
        build:
            context: .
            dockerfile: UltraWideBand/Dockerfile
        container_name: tracker
        depends_on:
            mqtt:
                condition: service_started
            server:
                condition: service_started
        env_file:
            - .env
        volumes:
            - /dev:/dev
        device_cgroup_rules:
            - 'c 188:* rmw'
            - 'c 166:* rmw'

    test-data:
        build:
            context: .
            dockerfile: Tests/DataSimulationServer/Dockerfile
        container_name: test-data
        depends_on:
            mqtt:
                condition: service_started
            server:
                condition: service_started
        env_file:
            - .env
        restart: "no"
        profiles:
            - data
        command: python -m Tests.DataSimulationServer.run

    test-tracking:
        build:
            context: .
            dockerfile: Tests/TrackingSimulationServer/Dockerfile
        container_name: test-tracking
        depends_on:
            mqtt:
                condition: service_started
            server:
                condition: service_started
        env_file:
            - .env
        restart: "no"
        profiles:
            - tracking
        command: python -m Tests.TrackingSimulationServer.run

    test-distance:
        build:
            context: .
            dockerfile: Tests/Distance/Dockerfile
        container_name: test-distance
        env_file:
            - .env
        restart: "no"
        profiles:
            - distance
        volumes:
            - /dev:/dev
        device_cgroup_rules:
            - 'c 188:* rmw'
            - 'c 166:* rmw'
        command: python -m Tests.Distance.run

volumes:
    influxdb-data:
    grafana-storage:
    pgdata:
